name: Build IPQ807x MIBIB and CDT Artifacts

on:
  push:
    branches: [ master, main, feature/python3-port ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPQ807x Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create Build Directories
        run: |
          mkdir -p build_out/cdt
          mkdir -p build_out/mibib

      - name: Generate CDT Binaries (IPQ807x)
        run: |
          python3 scripts/gen_cdt_bin.py -c ipq807x/config.xml -o build_out/cdt

      - name: Generate MIBIB Flash Partition Binaries (IPQ807x)
        run: |
          for flash_type in nand nor norplusnand emmc norplusemmc; do
            echo "Building MIBIB for flash_type: ${flash_type}..."
            python3 scripts/gen_flash_partition_bin.py -c ipq807x/config.xml -f ${flash_type} -o build_out/mibib
          done

      - name: Upload IPQ807x Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipq807x-mibib-cdt-artifacts
          path: build_out/
